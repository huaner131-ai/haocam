<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="HaoCam — kamera beauty & AR real-time: skin smoothing, face reshaping, LUT grading, lens AR, rekam 60fps. WebGL2 + face mesh on-device."
    />
    <title>HaoCam — Beauty & AR Camera</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff5f8f'/%3E%3Cstop offset='.5' stop-color='%23ffb35c'/%3E%3Cstop offset='1' stop-color='%235ce1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a0a12'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #08080c;
        color: #f4f4f8;
        overscroll-behavior: none;
        font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      }
      /* Splash agar first paint tidak putih */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 12px;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7c7c92;
      }
      #boot b {
        display: block;
        font-size: 22px;
        letter-spacing: 0.3em;
        background: linear-gradient(90deg, #ff5f8f, #ffb35c, #5ce1ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><div><b>HAOCAM</b>booting render pipeline…</div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
